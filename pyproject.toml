[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apymix"]

[project]
name = "apymix"
version = "0.5.1"
description = "Apymix — API Python Mix (framework multi-apps)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "pydantic-settings>=2.7",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "pyyaml>=6.0",
    "email-validator>=2.0",
    "sqladmin>=0.20",
    "itsdangerous>=2.0",
    "httpx>=0.28",
    "slowapi>=0.1.9",
    "boto3>=1.42.65",
]

[project.scripts]
apymix = "apymix.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.2",
]

[tool.uv]
allow-insecure-host = ["pypi.org", "files.pythonhosted.org"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
